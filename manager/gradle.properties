android.experimental.enableNewResourceShrinker.preciseShrinking=true
android.enableAppCompileTimeRClass=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048m
org.gradle.workers.max=2
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.vfs.watch=true
android.r8.maxWorkers=1
android.native.buildOutput=verbose

# x86_64 aapt2 from maven cannot start its daemon under qemu-user on aarch64;
# route AGP to the build-tools copy that is wrapped with a qemu shim.
android.aapt2FromMavenOverride=/root/1/inbox/tomie/toolchain/sdk/build-tools/37.0.0/aapt2
